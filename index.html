<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Essex House Recipes</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#292e29;font:16px system-ui,sans-serif}header{background:#263d35;color:#fff;padding:54px 24px 44px}header div,main,footer{max-width:1100px;margin:auto}header small{letter-spacing:.22em;color:#e2c49b}h1{font:clamp(36px,7vw,64px) Georgia,serif;margin:14px 0}header p{color:#e1e8df;max-width:580px;line-height:1.6}main{padding:32px 22px}h2{font:32px Georgia,serif;margin:0 0 18px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}input,select,button,a.action{font:inherit;border:1px solid #c9cec5;border-radius:8px;padding:12px;background:white;color:#263d35}input{flex:1;min-width:190px}button,a.action{cursor:pointer;text-decoration:none;text-align:center}button:hover,a.action:hover{background:#e8eee5}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b77c36;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:20px}.card{background:white;border:1px solid #e2ddd3;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.art{height:125px;background:#e9dfcd;display:grid;place-items:center;font-size:54px}.card:nth-child(3n+2) .art{background:#e6eadd}.card:nth-child(3n+3) .art{background:#eddfd9}.content{padding:22px;flex:1;display:flex;flex-direction:column}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#68794e;font-weight:700}h3{font:26px Georgia,serif;margin:10px 0}.desc{color:#62665e;line-height:1.5;flex:1}.actions{display:grid;gap:8px;margin-top:14px}.primary{background:#263d35!important;color:white!important;border-color:#263d35!important}.meta{color:#646b62;font-size:14px;margin:0 0 15px}footer{padding:24px;color:#62665e;border-top:1px solid #ddd6ca;font-size:14px}footer a{color:#263d35}.note{font-size:13px;color:#646b62} </style></head><body><header><div><small>THE ESSEX FAMILY COLLECTION</small><h1>Essex House Recipes</h1><p>Favorite recipes, new discoveries, and good food worth sharing. Find your next favorite and save it to Mealie.</p></div></header><main><h2>Recipe library</h2><div class="controls"><input id="search" type="search" placeholder="Search recipes…" aria-label="Search recipes"><select id="category" aria-label="Filter by category"><option value="">All categories</option></select></div><p id="count" class="meta" aria-live="polite"></p><div id="recipes" class="grid"></div><p id="status" class="note" role="status"></p></main><footer>Essex House Recipes · <a href="https://github.com/bessex3/mealie-recipes">Manage recipes on GitHub</a> · <a href="https://mealie.wells.gg/">Open Mealie</a></footer><script>
const base='https://bessex3.github.io/mealie-recipes/';const initial=[{file:'Dirty_Tacos_Blackstone_Mobile.html',name:'Dirty Tacos on the Blackstone',category:'Main dishes',description:'Steak, smoked sausage, crispy cheese and jalapeño cilantro crema.',icon:'🌮'},{file:'Extra_Chewy_Chocolate_Chip_Cookies.html',name:'Extra Chewy Chocolate Chip Cookies',category:'Cookies',description:'Extra chewy cookies with bread flour and an overnight dough rest.',icon:'🍪'},{file:'Old_Fashioned_Possum_Pie.html',name:'Old-Fashioned Possum Pie',category:'Desserts',description:'Shortbread pecan crust, cream cheese, chocolate pudding and whipped cream.',icon:'🥧'}];let recipes=[...initial];const $=id=>document.getElementById(id);function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}function render(){let old=$('category').value; $('category').replaceChildren(new Option('All categories',''));[...new Set(recipes.map(r=>r.category))].sort().forEach(c=>$('category').add(new Option(c,c)));$('category').value=old;let q=$('search').value.toLowerCase().trim(),c=$('category').value;let filtered=recipes.filter(r=>(!c||r.category===c)&&[r.name,r.description,r.category].join(' ').toLowerCase().includes(q));$('count').textContent=filtered.length+' of '+recipes.length+' recipes';$('recipes').replaceChildren();if(!filtered.length)$('recipes').append(el('p','','No matching recipes. Try another search.'));for(let r of filtered){let card=el('article','card'),art=el('div','art',r.icon||'🍽️');art.setAttribute('aria-hidden','true');let content=el('div','content'),actions=el('div','actions'),a=el('a','action primary','View recipe'),b=el('button','','Copy Mealie URL');let url=base+encodeURIComponent(r.file);a.href=url;b.type='button';b.onclick=async()=>{try{await navigator.clipboard.writeText(url);b.textContent='Copied!';setTimeout(()=>b.textContent='Copy Mealie URL',1800)}catch{window.prompt('Copy this recipe URL:',url)}};actions.append(a,b);content.append(el('div','tag',r.category),el('h3','',r.name),el('p','desc',r.description||'Open the recipe for ingredients and instructions.'),actions);card.append(art,content);$('recipes').append(card)}}$('search').oninput=render;$('category').onchange=render;render();
function findRecipe(x){if(!x||typeof x!=='object')return null;if(Array.isArray(x)){for(let v of x){let r=findRecipe(v);if(r)return r}return null}if([x['@type']].flat().includes('Recipe'))return x;return findRecipe(x['@graph'])}async function discover(){try{let res=await fetch('https://api.github.com/repos/bessex3/mealie-recipes/contents/');if(!res.ok)throw Error('listing unavailable');let files=await res.json();if(!Array.isArray(files))throw Error('invalid listing');let added=await Promise.all(files.filter(f=>f.type==='file'&&/\.html$/i.test(f.name)&&f.name.toLowerCase()!=='index.html'&&!initial.some(r=>r.file===f.name)).map(async f=>{try{let response=await fetch(base+encodeURIComponent(f.name));if(!response.ok)return null;let doc=new DOMParser().parseFromString(await response.text(),'text/html');let r=null;for(let s of doc.querySelectorAll('script[type="application/ld+json"]')){try{r=findRecipe(JSON.parse(s.textContent));if(r)break}catch{}}if(!r)return null;let cat=[r.recipeCategory].flat().filter(v=>typeof v==='string')[0]||'Other';return {file:f.name,name:typeof r.name==='string'?r.name:f.name.replace(/\.html$/i,'').replaceAll('_',' '),category:cat,description:typeof r.description==='string'?r.description:'',icon:'🍽️'}}catch{return null}}));recipes=[...initial,...added.filter(Boolean)];render();$('status').textContent='Recipe library checked against GitHub.'}catch{$('status').textContent='Showing the saved recipe collection. Automatic discovery is temporarily unavailable.'}}discover();</script></body></html>
